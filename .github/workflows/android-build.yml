name: Build & Release Android APK (64-bit)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build 64-bit Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew
        working-directory: app

      - name: Build 64-bit Release APKs
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentForge-Android-64bit-APKs
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Workflow Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: AgentForge Release ${{ github.ref_name }}
          body: |
            ## AgentForge Android 64-bit Release
            - **Minimum Required Android Version:** Android 8.0 Oreo (API 26+)
            - **Supported Architectures:** 64-bit strictly (`arm64-v8a`, `x86_64`)
            - **Developer & Copyright:** Moataz Al-Alqami (معتز العلقمي) — Taiz, Yemen (تعز، اليمن)
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
