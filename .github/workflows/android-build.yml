name: Build & Release Android APK (64-bit)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build 64-bit Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Dummy Keystore if Missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build 64-bit Release APKs
        run: gradle :app:assembleRelease --no-daemon -PKEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore -PSTORE_PASSWORD=android -PKEY_PASSWORD=android

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentForge-Android-64bit-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: AgentForge Release ${{ github.ref_name }}
          body: |
            ## AgentForge Android 64-bit Release
            - **Minimum Required Android Version:** Android 8.0 Oreo (API 26+)
            - **Supported Architectures:** 64-bit strictly (`arm64-v8a`, `x86_64`)
            - **Developer & Copyright:** Moataz Al-Alqami (معتز العلقمي) — Taiz, Yemen (تعز، اليمن)
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
