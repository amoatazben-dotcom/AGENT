version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: agentforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: agentforge-gateway
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/agentforge?schema=public
      REDIS_URL: redis://redis:6379
      COMPUTER_WORKER_URL: http://computer-worker:3002
      JWT_SECRET: super-secret-jwt-key-agentforge-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  computer-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.computer-worker
    container_name: agentforge-computer-worker
    environment:
      PORT: 3002
    ports:
      - "3002:3002"

  nginx:
    image: nginx:alpine
    container_name: agentforge-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  minio_data:
